name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linter
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install .[dev]

      - name: Run Unit Tests
        run: pytest tests/unit/ -v

  integration:
    name: Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ocr_user
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ocr_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      SERMS_API_KEY: test-serms-key
      PRS_API_KEY: test-prs-key
      CALLBACK_API_KEY: test-callback-key
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DATABASE: ocr_pipeline_test
      POSTGRES_URL: postgresql+asyncpg://ocr_user:secret@localhost:5432/ocr_pipeline
      OLLAMA_BASE_URL: http://localhost:11434

    steps:
      - uses: actions/checkout@v4

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-osd \
            libgl1 \
            libglib2.0-0 \
            poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install .[dev]

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run Integration Tests
        run: pytest tests/integration/ -v -m integration

  e2e:
    name: End-to-End Tests
    needs: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ocr_user
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ocr_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      SERMS_API_KEY: test-serms-key
      PRS_API_KEY: test-prs-key
      CALLBACK_API_KEY: test-callback-key
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DATABASE: ocr_pipeline_test
      POSTGRES_URL: postgresql+asyncpg://ocr_user:secret@localhost:5432/ocr_pipeline
      OLLAMA_BASE_URL: http://localhost:11434

    steps:
      - uses: actions/checkout@v4

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-osd \
            libgl1 \
            libglib2.0-0 \
            poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install .[dev]

      - name: Cache sentence-transformers model
        run: python scripts/download_model.py

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run End-to-End Tests
        run: pytest tests/e2e/ -v -m e2e
