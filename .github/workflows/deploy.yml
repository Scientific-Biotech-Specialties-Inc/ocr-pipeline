name: deploy-ocr

# Builds the OCR image (api/worker) and deploys to Azure
# Container Apps. Requires the infra repo to have been deployed first.
#
# Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC).

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  RG: rg-capstone
  REGISTRY_ORG: ghcr.io/scientific-biotech-specialties-inc
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Azure
    needs: [ci]
    runs-on: ubuntu-latest
    concurrency: { group: azure-ocr, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ocr-api (FastAPI + Celery worker image)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/ocr-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_ORG }}/ocr-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll ocr-api
        run: az containerapp update -n ocr-api -g "${{ env.RG }}" --image ${{ env.REGISTRY_ORG }}/ocr-api:${{ env.IMAGE_TAG }}

      - name: Roll ocr-worker
        run: az containerapp update -n ocr-worker -g "${{ env.RG }}" --image ${{ env.REGISTRY_ORG }}/ocr-api:${{ env.IMAGE_TAG }}