[project]
name = "ocr-pipeline"
version = "1.0.0"
description = "AI OCR Pipeline for SERMS"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "motor>=3.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",
    "pdf2image>=1.17.0",
    # Fuzzy matching for vendor-name grounding and constrained selection.
    "rapidfuzz>=3.9.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live_llm: opt-in tests requiring a reachable Ollama service",
    "integration: tests requiring backing services or full pipeline wiring",
    "e2e: full stack asynchronous lifecycle tests",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.5.0"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled pragmatically
    "W291",  # trailing whitespace in existing files
    "W293",  # whitespace on blank lines
    "E402",  # module import not at top of file (e.g. sys.path manipulation in scripts)
    "E741",  # single-letter variable names in existing comprehension
    "F841",  # unused local variables in existing routines
]

